<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(99, 102, 241, 0.28), transparent 35%),
                radial-gradient(circle at bottom right, rgba(14, 165, 233, 0.20), transparent 35%),
                #0f172a;
            color: #f8fafc;
        }

        .welcome-card {
            width: min(620px, 100%);
            padding: 52px 40px;
            text-align: center;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 24px;
            background: rgba(15, 23, 42, 0.78);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(14px);
        }

        .badge {
            display: inline-block;
            padding: 7px 14px;
            margin-bottom: 18px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(255, 255, 255, 0.06);
            color: #a5b4fc;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        h1 {
            font-size: clamp(32px, 6vw, 48px);
            line-height: 1.1;
            margin-bottom: 14px;
        }

        p {
            color: #94a3b8;
            font-size: 16px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 28px;
            padding: 13px 24px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }
    </style>
</head>

<body>
    <main class="welcome-card">
        <span class="badge">MACHINE LEARNING APPLICATION</span>

        <h1>Welcome</h1>

        <p>
            Student Exam Performance Predictor
        </p>

        <a href="predictdata" class="button">
            Start Prediction
        </a>
    </main>
</body>

</html>
